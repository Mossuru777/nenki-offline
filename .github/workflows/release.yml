name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      dry_run:
        description: Dry run
        required: true
        default: false
        type: boolean
      draft:
        description: Draft
        required: true
        default: false
        type: boolean
      pre_release:
        description: Pre Release
        required: true
        default: false
        type: boolean

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 前回リリースからの変更履歴を取得できるようにする。
          fetch-depth: 0
          persist-credentials: false

      - uses: MeilCli/bump-release-action@c07980926b3f330788297279580f7f16f0633008 # v3.0.15
        id: release
        with:
          config_path: .github/bump.yml
          bump: ${{ inputs.bump }}
          dry_run: ${{ inputs.dry_run }}
          draft: ${{ inputs.draft }}
          pre_release: ${{ inputs.pre_release }}

  build-and-deploy:
    name: Build and Deploy
    needs: bump-version
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build_and_optionally_deploy.yml
    with:
      # ワークフローのトークンで公開したリリースは published イベントから再実行されない。
      deploy: ${{ !inputs.dry_run && !inputs.draft }}
      ref: ${{ !inputs.dry_run && !inputs.draft && format('refs/tags/{0}', fromJSON(needs.bump-version.outputs.release).tag_name) || github.sha }}
