name: Build and optionally deploy

on:
  push:
    branches: [ main ]
    tags-ignore: [ 'v*' ]

  pull_request:
    branches: [ main ]

  release:
    types: [published]

  workflow_call:
    inputs:
      deploy:
        default: false
        type: boolean
      ref:
        type: string

jobs:
  build-and-optionally-deploy:
    name: Build (optionally deploy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install npm packages
        shell: bash
        run: npm ci --no-progress --no-audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build Next.js app
        shell: bash
        run: npm run build
        env:
          URL_PREFIX: ${{ github.event.repository.name }}

      - name: Upload GitHub Pages files
        if: ${{ github.event_name == 'release' || inputs.deploy }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.event_name == 'release' || inputs.deploy }}
    needs: build-and-optionally-deploy
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Next.js app to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
