name: Build and optionally deploy

on:
  push:
    branches: [ main ]
    tags-ignore: [ 'v*' ]

  pull_request:
    branches: [ main ]

  release:
    types: [published]

  workflow_call:
    inputs:
      deploy:
        default: false
        type: boolean
      ref:
        type: string

jobs:
  build-and-optionally-deploy:
    name: Build (optionally deploy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install npm packages
        shell: bash
        run: npm ci --no-progress --no-audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build Next.js app
        shell: bash
        run: npm run build
        env:
          URL_PREFIX: ${{ github.event.repository.name }}

      - name: Upload Cloudflare Pages files
        if: ${{ github.event_name == 'release' || inputs.deploy }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-pages
          path: out/
          if-no-files-found: error
          include-hidden-files: true

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    if: ${{ github.event_name == 'release' || inputs.deploy }}
    needs: build-and-optionally-deploy
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: https://mossuru777.net/nenki-offline/
    steps:
      - name: Download Cloudflare Pages files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-pages
          path: pages-out/nenki-offline/

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Check cache purge configuration
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ZONE_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Configure CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN in the cloudflare-pages environment.'
            exit 1
          fi

      - name: Deploy release files
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: npm exec --yes --package=wrangler@4.168.0 -- wrangler pages deploy pages-out --project-name="$PAGES_PROJECT" --branch=main

      - name: Purge production app path from Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          curl --silent --show-error --fail-with-body --retry 3 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"prefixes":["mossuru777.net/nenki-offline"]}' \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            | jq -e '.success == true' > /dev/null
